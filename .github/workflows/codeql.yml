name: "CodeQL and Deploy"

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: '17 20 * * 1'
  workflow_dispatch:

concurrency:
  group: prod-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  security-events: write
  packages: read
  actions: read

jobs:

  # ------------------------------------------
  # CodeQL Analysis
  # ------------------------------------------
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - language: javascript-typescript
            build-mode: none

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      - if: matrix.build-mode == 'manual'
        shell: bash
        run: |
          echo "Manual build mode - please define your build steps."
          exit 1

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"

  # ------------------------------------------
  # Deploy Job (Vercel + Sleuth)
  # ------------------------------------------
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: analyze
    environment: production

    steps:
      - name: Checkout (full history p/ métricas)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # --------------------------
      # Deploy para Vercel
      # --------------------------
      - name: Install Vercel CLI
        run: npm install --global vercel

      - name: Deploy to Vercel
        id: deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          vercel --prod --yes --token $VERCEL_TOKEN

      # --------------------------
      # Notifica Sleuth após deploy
      # --------------------------
      - name: Notify Sleuth
        if: ${{ success() && steps.deploy.outcome == 'success' }}
        uses: sleuth-io/sleuth-action@v1
        with:
          api_key: ${{ secrets.SLEUTH_API_KEY }}
          environment: production
